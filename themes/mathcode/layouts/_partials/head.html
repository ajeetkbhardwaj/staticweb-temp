<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ if .IsHome }}{{ site.Title }} — Pure & Applied Mathematics, Lean 4 Proofs & Code{{ else }}{{ printf "%s | %s" .Title site.Title }}{{ end }}</title>
<meta name="description" content="{{ or .Params.description site.Params.description }}">
{{ partial "head/opengraph.html" . }}
<link rel="icon" type="image/png" href="{{ "pc.png" | relURL }}">

<script>
  (function() {
    try {
      var savedTheme = localStorage.getItem('mathcode-theme') || 'dark';
      document.documentElement.setAttribute('data-bs-theme', savedTheme);
    } catch (e) {
      document.documentElement.setAttribute('data-bs-theme', 'dark');
    }
  })();
</script>
