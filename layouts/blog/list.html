{{ define "main" }}
<div style="height:100%;overflow:auto">
  <div class="container py-5">
    <h1 class="mb-1">Blog & Articles</h1>
    <p class="text-muted mb-4">Free reads on embedded systems, firmware, and C programming.</p>
    <div class="row g-3">
      {{ range .Pages.ByDate.Reverse }}
      <div class="col-md-6">
        <a href="{{ .RelPermalink }}" class="card h-100 text-decoration-none" style="background:var(--bs-body-bg)">
          <div class="card-body">
            <p class="small text-muted mb-1">{{ .Date.Format "Jan 2, 2006" }} · {{ .ReadingTime }} min read</p>
            <h2 class="h5">{{ .Title }}</h2>
            <p class="small text-muted mb-0">{{ .Params.description | plainify | truncate 120 }}</p>
          </div>
        </a>
      </div>
      {{ end }}
    </div>
  </div>
</div>
{{ end }}
